[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docutrust"
version = "1.0.0"
description = "Sovereign trust fabric for verifiable credentials, autonomous agent identity federation, confidential mixnets, RAG provenance, and zero-knowledge state machines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/docutrust"

[tool.setuptools]
py-modules = ['']

name: 🚀 Feature Request
description: Propose a new feature, protocol extension, or improvement
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature or improvement for DocuTrust!

  - type: input
    id: summary
    attributes:
      label: Feature Title
      description: Brief one-line summary of the proposed feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific use case? Please describe.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see. Include cryptographic protocols, API endpoints, or CLI commands if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or features you've considered.

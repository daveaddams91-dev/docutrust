name: 🐛 Bug Report
description: File a bug report to help us improve DocuTrust
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure this issue has not already been reported.

  - type: input
    id: version
    attributes:
      label: DocuTrust Version
      description: What version of DocuTrust are you running (e.g. v2.1.0)?
      placeholder: v2.1.0
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of DocuTrust is affected?
      options:
        - Core Cryptography (@docutrust/core)
        - CLI Tooling (@docutrust/cli)
        - REST API Server (@docutrust/api)
        - TypeScript SDK (@docutrust/sdk)
        - Python SDK (docutrust)
        - Web Dashboard (@docutrust/web)
        - Post-Quantum / BBS+ / ZK
        - PDF Generation / Verification
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `docutrust issue ...`
        2. Verify with `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Stack Trace
      description: Please copy and paste any relevant logs, errors, or stack traces here.
      render: shell

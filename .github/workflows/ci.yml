name: CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    name: Node.js Test Matrix (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Core & SDK
        run: |
          npm run build --workspace=@docutrust/core
          npm run build --workspace=@docutrust/sdk

      - name: Run Node.js Test Suites
        run: npm test

      - name: Build Web Application
        run: npm run build --workspace=@docutrust/web

  python-test:
    name: Python SDK Test Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python SDK & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e sdks/python

      - name: Run Python SDK Unit Tests
        run: python -m unittest discover -s sdks/python/tests

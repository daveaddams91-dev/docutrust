name: CI / Cryptographic Audit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  core-node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Build All Workspaces
      run: npm run build

    - name: Run Monorepo Test Suites (@docutrust/core, @docutrust/cli, @docutrust/api, @docutrust/web)
      run: npm test

    - name: Test CLI Keygen & Verification
      run: |
        node packages/cli/bin/docutrust.js keygen --out test-keys.json
        node packages/cli/bin/docutrust.js demo
        node packages/cli/bin/docutrust.js verify --vc examples/certificates/stanford-degree-vc.json

  python-sdk-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cryptography

    - name: Run Python SDK Unit Tests
      run: |
        python -m unittest sdks/python/tests/test_docutrust.py

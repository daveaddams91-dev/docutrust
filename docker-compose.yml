version: '3.8'

services:
  docutrust-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node apps/api/src/server.js
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped

  docutrust-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run preview --workspace=apps/web -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      - docutrust-api
    restart: unless-stopped

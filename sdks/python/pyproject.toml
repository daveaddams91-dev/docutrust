[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docutrust"
version = "19.0.0"
description = "Python SDK for DocuTrust - Open-Source Sovereign Trust Stack for Verifiable Digital Credentials & Cryptographic Ledger Anchoring"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "DocuTrust Contributors", email = "dev@docutrust.org"}
]
keywords = ["verifiable-credentials", "decentralized-identity", "did", "cryptography", "merkle-tree", "zero-knowledge"]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://github.com/Raj123-0/docutrust"
Documentation = "https://docutrust.org/docs"
Repository = "https://github.com/Raj123-0/docutrust.git"
